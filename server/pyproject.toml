[project]
name = "apple-music-hybrid"
version = "0.1.3"
description = "Catalog-grounded playlist curation and native Music.app control for agents."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp==2.2.0", "openai-mcp-extensions==0.2.0", "PyJWT[crypto]==2.10.1", "httpx==0.28.1"]

[project.scripts]
apple-music-hybrid = "apple_music_hybrid.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0", "jsonschema==4.25.1"]

[tool.ruff]
line-length = 100
exclude = ["src/apple_music_hybrid/vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
