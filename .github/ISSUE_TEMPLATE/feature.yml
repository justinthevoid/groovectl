name: Feature request
description: Describe a useful listening or operating task.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Give a concrete example and why existing tools fall short.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Suggested workflow and constraints
      description: Can this extend an existing workflow? Note platform, identity, privacy or verification limits.
